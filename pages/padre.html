<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento familiar — LectorIEP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231B3A5C%22/%3E%3Ctext x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%23C77D2E%22%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="app-sidebar"></aside>
  <div class="app-main">
    <header class="app-topbar" id="app-topbar"></header>
    <main class="app-content">

      <div class="page-header">
        <span class="page-eyebrow-tag"><i class="bi bi-people"></i> Seguimiento familiar</span>
        <h1 class="page-title" id="titulo-padre">El progreso de tu hijo(a)</h1>
        <p class="page-subtitle">Consulta el avance de lectura, insignias y préstamos de biblioteca de tu hijo(a) en el colegio.</p>
      </div>

      <div id="contenido-padre"></div>

    </main>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../js/data.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/cloud.js"></script>
<script src="../js/filedb.js"></script>
<script src="../js/app.js"></script>
<script>
  initDatabase();
  actualizarEstadosPrestamos();
  const usuario = renderShell("padre.html");

  const hijos = (usuario.hijosIds || []).map(id => getUserById(id)).filter(Boolean);
  const cont = document.getElementById("contenido-padre");

  if (hijos.length === 0) {
    cont.innerHTML = `<div class="empty-state"><i class="bi bi-person-x"></i>No hay estudiantes vinculados a tu cuenta todavía. Comunícate con la Coordinación CIST para vincular a tu hijo(a).</div>`;
  } else {
    cont.innerHTML = hijos.map(hijo => {
      const libros = librosLeidosPorUsuario(hijo.id);
      const minutos = minutosLeidosPorUsuario(hijo.id);
      const nivel = getNivelLector(hijo.puntos || 0);
      const prestamos = dbGet("prestamos").filter(p => p.usuarioId === hijo.id && p.estado !== "devuelto");
      const lecturas = dbGet("bitacora").filter(l => l.usuarioId === hijo.id).sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 5);
      const resultados = dbGet("resultadosQuiz").filter(r => r.usuarioId === hijo.id);

      return `
      <div class="card-lector" style="margin-bottom:18px;">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
          <div style="width:52px;height:52px;border-radius:50%;background:var(--amber-soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy-deep);">${hijo.avatar}</div>
          <div>
            <div style="font-family:var(--font-display);font-size:18px;">${hijo.nombre}</div>
            <div class="text-muted-soft" style="font-size:13px;">${etiquetaGrado(hijo.nivel, hijo.grado)} "${hijo.seccion}" · <i class="bi ${nivel.icono}"></i> ${nivel.nombre}</div>
          </div>
        </div>
        <div class="grid-cards grid-cols-4">
          <div class="card-lector bar-left stat-card"><span class="stat-label">Puntos</span><span class="stat-value">${hijo.puntos || 0}</span></div>
          <div class="card-lector bar-amber stat-card"><span class="stat-label">Racha</span><span class="stat-value"><i class="bi bi-fire"></i> ${hijo.racha || 0}</span></div>
          <div class="card-lector bar-forest stat-card"><span class="stat-label">Libros leídos</span><span class="stat-value">${libros}</span></div>
          <div class="card-lector bar-gold stat-card"><span class="stat-label">Minutos totales</span><span class="stat-value">${minutos}</span></div>
        </div>
      </div>

      <div class="grid-cards" style="grid-template-columns:1.3fr 1fr;margin-bottom:18px;">
        <div class="card-lector">
          <div class="section-title"><span>Últimas lecturas registradas</span></div>
          ${lecturas.length ? `<div class="table-scroll"><table class="table-lector">
            <thead><tr><th>Fecha</th><th>Libro</th><th>Páginas</th><th>Valoración</th></tr></thead>
            <tbody>${lecturas.map(l => `<tr><td>${formatoFecha(l.fecha)}</td><td>${getBookById(l.libroId).titulo}</td><td>${l.paginas}</td><td>${"⭐".repeat(l.autoevaluacion)}</td></tr>`).join("")}</tbody>
          </table></div>` : `<div class="empty-state"><i class="bi bi-journal-x"></i>Sin registros de lectura todavía.</div>`}
        </div>
        <div class="card-lector">
          <div class="section-title"><span>Préstamos activos</span></div>
          ${prestamos.length ? prestamos.map(p => `<div style="padding:8px 0;border-bottom:1px solid var(--line);"><strong style="font-size:13.5px;">${getBookById(p.libroId).titulo}</strong><div class="text-muted-soft" style="font-size:12px;">Devolver antes del ${formatoFecha(p.fechaDevolucionEsperada)}</div></div>`).join("") : `<div class="empty-state"><i class="bi bi-journal-check"></i>Sin préstamos activos.</div>`}
        </div>
      </div>

      <div class="card-lector">
        <div class="section-title"><span>Resultados de comprensión lectora</span></div>
        ${resultados.length ? `<div class="table-scroll"><table class="table-lector">
          <thead><tr><th>Fecha</th><th>Puntaje</th><th>Nivel</th></tr></thead>
          <tbody>${resultados.map(r => `<tr><td>${formatoFecha(r.fecha)}</td><td>${r.puntaje}%</td><td>${chipNivel(r.nivel)}</td></tr>`).join("")}</tbody>
        </table></div>` : `<div class="empty-state"><i class="bi bi-clipboard-x"></i>Aún no rinde evaluaciones de comprensión.</div>`}
      </div>`;
    }).join("<hr style='border-color:var(--line);margin:26px 0;'>");
  }
</script>
</body>
</html>
